<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:insert="fragments/head :: head('Trainers')"></div>

<body class="bg-light">

<div th:replace="fragments/header :: header"></div>

<div class="container mt-5" style="margin-left:260px;">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Trainers</h1>
        <a th:href="@{/trainers/new}" class="btn btn-danger">
            Add New Trainer
        </a>
    </div>

    <!-- Search -->
    <form th:action="@{/trainers/search}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text"
                   name="query"
                   class="form-control"
                   placeholder="Search by name"
                   required>
            <button type="submit" class="btn btn-outline-dark">
                Search
            </button>
        </div>
    </form>

    <!-- Table Card -->
    <div class="card shadow-sm border-0">
        <div class="card-body">

            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="entity : ${entities}">
                    <td th:text="${entity.id}">1</td>
                    <td th:text="${entity.firstName}">Jane</td>
                    <td th:text="${entity.lastName}">Smith</td>
                    <td class="text-end">
                        <a th:href="@{/trainers/{id}(id=${entity.id})}"
                           class="btn btn-sm btn-outline-danger">
                            View
                        </a>
                    </td>
                </tr>

                <!-- Empty state -->
                <tr th:if="${#lists.isEmpty(entities)}">
                    <td colspan="4" class="text-center text-muted py-4">
                        No trainers available
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
