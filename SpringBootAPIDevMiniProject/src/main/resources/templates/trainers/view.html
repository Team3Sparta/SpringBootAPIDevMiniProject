<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:insert="fragments/head :: head('Edit Trainer')"></div>


<body class="bg-light">
<div th:replace="fragments/header :: header"></div>

<div class="container mt-5">
    <h1 class="text-center">Edit Trainer</h1>

    <!-- Main Edit Form -->
    <form th:action="@{/trainers/{id}/update(id=${entity.id})}"
          th:object="${entity}"
          method="post"
          class="mt-4">

        <!-- ID (read-only + hidden for submission safety) -->
        <div class="mb-3">
            <label class="form-label">ID</label>
            <input type="text"
                   class="form-control-plaintext text-muted"
                   th:value="*{id}"
                   readonly>
            <input type="hidden" th:field="*{id}">
        </div>

        <!-- First Name -->
        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text"
                   class="form-control"
                   th:field="*{firstName}"
                   required>
        </div>

        <!-- Last Name -->
        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text"
                   class="form-control"
                   th:field="*{lastName}"
                   required>
        </div>

        <!-- Buttons -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary me-2">
                Save
            </button>

            <a th:href="@{/trainers}" class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>

    <!-- Delete Form  -->
    <div class="text-center mt-3">
        <form th:action="@{/trainers/{id}/delete(id=${entity.id})}"
              method="post"
              onsubmit="return confirm('Are you sure you want to remove this trainer?')">

            <button type="submit" class="btn btn-danger">
                Delete
            </button>
        </form>
    </div>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
