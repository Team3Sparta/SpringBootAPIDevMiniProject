<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<div th:insert="fragments/head :: head('To do List')"></div>

<body class="bg-light">
<div th:replace="fragments/header :: header"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-center">Courses List</h1>
        <a th:href="@{/courses/new}" class="btn btn-primary">Add New Course</a>
    </div>

    <div sec:authorize="isAuthenticated()"
         sec:authentication="principal.authorities">
    </div>
    <!--
    <form th:action="@{/courses/search}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="query" class="form-control" placeholder="Search by name" required>
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>
    -->

    <form th:action="@{/courses/exclude}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="query" class="form-control" placeholder="Exclude by name" required>
            <button type="submit" class="btn btn-primary">Exclude</button>
        </div>
    </form>
<!--
    <div sec:authorize="isAuthenticated()">
        Logged in as: <span sec:authentication="name"></span>
    </div>
    <div sec:authorize="hasRole('TRAINER')">
        You are a TRAINER
    </div>
    <div sec:authorize="hasRole('TRAINEE')">
        You are a TRAINEE
    </div>
    <div sec:authorize="isAuthenticated()" sec:authentication="principal.authorities"></div>
    <div>AAAAAAAAAAA!!!!!!!!!!!</div>
-->
    <table class="table table-striped mt-4">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entity : ${entities}">
            <td th:text="${entity.id}"></td>
            <td th:text="${entity.courseName}">
            <td>
                <a th:href="@{/courses/{id}(id=${entity.id})}" class="btn btn-info btn-sm">View</a>
            </td>

        </tr>
        </tbody>
    </table>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
</html>
