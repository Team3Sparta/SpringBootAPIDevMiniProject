<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:insert="fragments/head :: head('New Course')"></div>

<body class="bg-light">

<div th:replace="fragments/header :: header"></div>

<div class="container mt-5" style="margin-left:600px;">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>New Course</h1>
        <a href="/courses" class="btn btn-outline-dark">
            Back to Courses
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <form th:action="@{/courses/save}"
                  th:object="${entity}"
                  method="post">

                <div class="mb-4">
                    <label for="courseName" class="form-label fw-semibold">
                        Course Name
                    </label>
                    <input type="text"
                           id="courseName"
                           th:field="*{courseName}"
                           class="form-control"
                           placeholder="e.g. Java Fundamentals"
                           required>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/courses"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                    <button type="submit"
                            class="btn btn-danger">
                        Save Course
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
