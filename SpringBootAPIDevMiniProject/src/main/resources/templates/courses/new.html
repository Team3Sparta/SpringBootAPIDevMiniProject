<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:insert="fragments/head :: head('Create To Do')"></div>

<body class="bg-light">
<div th:replace="fragments/header :: header"></div>
<div class="container mt-5">
    <h1 class="text-center">Edit Course</h1>
    <form th:action="@{/courses/save}" th:object="${entity}" method="post" class="mt-4">
        <!-- Title Field -->
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" id="title" name="title" th:field="*{courseName}" class="form-control" required>
        </div>
        <div class="text-center">
            <form th:action="@{/courses/save}" th:object="${entity}" method="post" class="d-inline">
                <button type="submit" class="btn btn-primary">Save</button>
            </form>
            <a href="/courses" class="btn btn-secondary d-inline">Cancel</a>
        </div>

    </form>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
