<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:insert="fragments/head :: head('Edit Trainee')"></div>

<body class="bg-light">

<div th:replace="fragments/header :: header"></div>

<div class="container mt-5" style="margin-left:260px;">

    <h1 class="mb-4 text-center">Edit Trainee</h1>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <!-- Edit Form -->
            <form th:action="@{/trainees/{id}/update(id=${entity.id})}"
                  th:object="${entity}"
                  method="post">

                <!-- ID -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <span class="fw-semibold text-muted">ID</span>
                        <span class="text-muted" th:text="*{id}">1</span>
                    </div>
                    <input type="hidden" th:field="*{id}">
                </div>

                <!-- First Name -->
                <div class="mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{firstName}"
                           required>
                </div>

                <!-- Last Name -->
                <div class="mb-4">
                    <label class="form-label">Last Name</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{lastName}"
                           required>
                </div>

                <!-- Buttons -->
                <div class="text-center">
                    <button type="submit" class="btn btn-danger me-2">
                        Save
                    </button>

                    <a th:href="@{/trainees}" class="btn btn-outline-dark">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>

    <!-- Delete -->
    <div class="text-center mt-3">
        <form th:action="@{/trainees/{id}/delete(id=${entity.id})}"
              method="post"
              onsubmit="return confirm('Are you sure you want to delete this trainee?')">

            <button type="submit" class="btn btn-outline-danger">
                Delete
            </button>
        </form>
    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
