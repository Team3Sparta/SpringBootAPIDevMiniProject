<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:insert="fragments/head :: head('Trainees')"></div>

<body class="bg-light">
<div th:replace="fragments/header :: header"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-center">Trainee List</h1>
        <a th:href="@{/trainees/new}" class="btn btn-primary">Add New Trainee</a>
    </div>

    <!--
    <form th:action="@{/trainee/search}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="query" class="form-control" placeholder="Search by name" required>
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>
    -->

    <form th:action="@{/trainees/exclude}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="query" class="form-control" placeholder="Exclude by name" required>
            <button type="submit" class="btn btn-primary">Exclude</button>
        </div>
    </form>


    <table class="table table-striped mt-4">
        <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entity : ${entities}">
            <td th:text="${entity.id}"></td>
            <td th:text="${entity.firstName}">
            <td th:text="${entity.lastName}">
            <td>
                <a th:href="@{/trainees/{id}(id=${entity.id})}" class="btn btn-info btn-sm">View</a>
            </td>

        </tr>
        </tbody>
    </table>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
</html>
