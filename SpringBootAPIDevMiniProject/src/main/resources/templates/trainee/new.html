<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:insert="fragments/head :: head('Add New Trainee')"></div>

<body class="bg-light">
<div th:replace="fragments/header :: header"></div>
<div class="container mt-5">
    <h1 class="text-center">New Trainee</h1>
    <form th:action="@{/trainee/save}" th:object="${entity}" method="post" class="mt-4">
        <div class="mb-3">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" th:field="*{firstName}" id="firstName" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" th:field="*{lastName}" id="lastName" class="form-control" required>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/trainee}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
