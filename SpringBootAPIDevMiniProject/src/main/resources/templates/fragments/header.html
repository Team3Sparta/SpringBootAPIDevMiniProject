<header th:fragment="header"
        class="bg-primary text-white p-3 d-flex justify-content-between align-items-center"
        xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <h1 class="text-center">Sparta Global Group 3 Courses</h1>

    <div class="d-flex align-items-center gap-3">
        <a href="/courses" class="btn btn-light">Courses</a>
        <a href="/trainers" class="btn btn-light">Trainers</a>


        <!-- Logout form -->
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-light btn-sm">Logout</button>
        </form>
    </div>
</header>
